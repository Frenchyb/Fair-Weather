<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fair Weather</title>
    <style>
      :root {
        --ink: #2f3a2c;
        --paper: rgba(255, 252, 240, 0.82);
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bcdcf0;
        font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
        color: var(--ink);
        user-select: none;
        -webkit-user-select: none;
      }
      /* A canvas is a replaced element: give it a real size or it lays out at
         its drawing-buffer size, which is 2x the window on a Retina screen. */
      #view {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }
      .card {
        position: fixed;
        background: var(--paper);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 15px;
        line-height: 1.35;
        box-shadow: 0 2px 10px rgba(40, 60, 30, 0.15);
        pointer-events: none;
      }
      #hint {
        left: 16px;
        top: 16px;
        max-width: 300px;
        transition: opacity 1.2s;
      }
      #hint b {
        font-weight: normal;
        font-style: italic;
      }
      #count {
        right: 16px;
        top: 16px;
      }
      #tip {
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.25s;
        white-space: nowrap;
      }
      #done {
        left: 50%;
        top: 22%;
        transform: translateX(-50%);
        font-size: 22px;
        padding: 14px 22px;
        opacity: 0;
        transition: opacity 2s;
        text-align: center;
      }
      #done small {
        display: block;
        font-size: 14px;
        margin-top: 4px;
        opacity: 0.75;
      }
      @media (max-width: 600px) {
        .card {
          font-size: 13px;
        }
        #hint {
          max-width: 200px;
        }
        #tip {
          white-space: normal;
          width: calc(100vw - 64px);
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hint" class="card">
      You are the weather over this garden.<br />
      <b>Move</b> to steer the cloud. <b>Hold the mouse button</b> (or space) to rain.
      Rest the cloud over the pond to fill it up.
    </div>
    <div id="count" class="card"></div>
    <div id="tip" class="card"></div>
    <div id="done" class="card">
      Full bloom. The bees have found your garden.
      <small>Stay as long as you like.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
